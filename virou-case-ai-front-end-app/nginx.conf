server {
    listen 8080;
    server_name 127.0.0.1 localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_backend http://viroucaseai-public-api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    sub_filter '__VIRA_CSP_NONCE__' '$request_id';
    sub_filter_once off;
    location = /preview.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'nonce-$request_id' blob:; script-src-attr 'unsafe-inline'; style-src 'unsafe-inline' blob:; img-src data: blob:; font-src data: blob:; media-src data: blob:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; sandbox allow-scripts" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location = /health/ready {
        proxy_pass $api_backend/health/ready;
        proxy_set_header Host localhost;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        access_log off;
    }
    location /api/ {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
