server {
    listen 8080;
    server_name 127.0.0.1 localhost;
    if ($host !~ ^(127\.0\.0\.1|localhost)$) { return 444; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_backend http://viroucaseai-admin-api:8001;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health/ready {
        proxy_pass $api_backend/health/ready;
        proxy_set_header Host localhost;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        access_log off;
    }
    location /admin-api/ {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
