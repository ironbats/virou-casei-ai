name: viroucaseai-backoffice
services:
  backoffice:
    build: .
    image: viroucaseai-backoffice:2.0.0.19
    restart: unless-stopped
    ports:
      - "127.0.0.1:5175:8080"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
networks:
  backend:
    external: true
    name: viroucaseai-admin
