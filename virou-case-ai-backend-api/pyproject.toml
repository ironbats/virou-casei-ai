[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "viroucaseai-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6", "psycopg[binary]==3.3.6", "alembic==1.20.1", "httpx==0.28.1", "argon2-cffi==25.1.0", "pydantic-settings==2.16.1", "cryptography==50.0.2", "google-auth==2.62.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

